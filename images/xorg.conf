Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
EndSection
Section "Device"
    Identifier "VirtioDisplay"
    Driver "modesetting"
    Option "AccelMethod" "none"
    Option "kmsdev" "/dev/dri/card0"
EndSection
Section "Screen"
    Identifier "PrivateScreen"
    Device "VirtioDisplay"
    DefaultDepth 24
EndSection
